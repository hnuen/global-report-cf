name: Monitor and Alert

on:
  # Timing moved 2026-06-27 to the same dedicated Cloudflare Worker
  # (../cron-worker) that already drives refresh.yml, with its own native
  # Cron Trigger calling workflow_dispatch below on an hourly schedule. This
  # workflow previously used GitHub Actions' own `schedule:` trigger, which
  # is the exact mechanism documented in cron-worker/wrangler.toml as
  # silently delaying/dropping runs under platform load with no SLA — for
  # an alerting pipeline, a delayed run meant a backlog of articles aging
  # past the alert-eligibility window before they were ever evaluated, then
  # several qualifying at once on whatever run finally fired (the root cause
  # of a multi-day alert burst reported 2026-06-25). This workflow is now
  # dispatch-only; do not re-add a `schedule:` block here, or both
  # schedulers will fire and double-send alerts.
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional focus topic for this monitor run'
        required: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run monitor
        run: |
          BODY="{}"
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            BODY="{\"topic\":\"${{ github.event.inputs.topic }}\"}"
          fi

          # Strip any trailing slash from APP_URL to avoid a double-slash URL
          # (Cloudflare 308-redirects that, and curl won't follow it without -L).
          APP_URL="${{ secrets.APP_URL }}"
          APP_URL="${APP_URL%/}"

          HTTP=$(curl -s -L -o /tmp/resp.json -w "%{http_code}" \
            -X POST "$APP_URL/api/monitor" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_BYPASS_TOKEN }}" \
            -d "$BODY" \
            --max-time 120)

          echo "HTTP: $HTTP"
          cat /tmp/resp.json

          if [ "$HTTP" != "200" ]; then
            echo "Failed with HTTP $HTTP"
            exit 1
          fi
          echo "Success"

          # Expose alerting count for the ntfy step below
          ALERTING=$(python3 -c "import json,sys; d=json.load(open('/tmp/resp.json')); print(d.get('alerting',0))" 2>/dev/null || echo "0")
          echo "alerting=$ALERTING" >> "$GITHUB_OUTPUT"
        id: monitor

      - name: Send ntfy alerts (direct from GitHub — bypasses Cloudflare IP block)
        if: ${{ steps.monitor.outputs.alerting > 0 }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          APP_URL:    ${{ secrets.APP_URL }}
        run: |
          ALERTING="${{ steps.monitor.outputs.alerting }}"

          # Extract headlines + primary click URL from alertedArticles.
          # URLs are NOT embedded in the body — mobile push bodies truncate at
          # ~200 chars and the URL is the first thing cut. Instead we use
          # ntfy's Click header so tapping the notification opens the article
          # directly. Falls back to the app URL if no article sourceUrl exists.
          NTFY_INFO=$(python3 -c "
          import json
          d = json.load(open('/tmp/resp.json'))
          arts = d.get('alertedArticles') or [a for a in d.get('topScored', []) if a.get('shouldAlert')]
          click = next((a.get('sourceUrl','') for a in arts if a.get('sourceUrl') and a.get('sourceUrl') != '#'), '')
          def fmt(a):
              sec = a.get('section','').upper()
              region = a.get('region','')
              tag = f\"{sec} | {region}\" if region else sec
              return f\"{tag}\\n{a.get('headline','')[:120]}\"
          lines = [fmt(a) for a in arts[:5]]
          print(click)
          print('\\n\\n'.join(lines) if lines else 'See app for details')
          " 2>/dev/null)

          CLICK_URL=$(echo "$NTFY_INFO" | head -1)
          BODY=$(echo "$NTFY_INFO" | tail -n +2)
          [ -z "$CLICK_URL" ] && CLICK_URL="${APP_URL%/}"

          TITLE="🚨 Global Report — ${ALERTING} alert$([ "$ALERTING" -eq 1 ] || echo s)"

          AUTH_ARGS=()
          if [ -n "$NTFY_TOKEN" ]; then
            AUTH_ARGS+=(-H "Authorization: Bearer $NTFY_TOKEN")
          fi

          HTTP_NTFY=$(curl -s -o /tmp/ntfy_resp.txt -w "%{http_code}" \
            -X POST "https://ntfy.sh/${NTFY_TOPIC}" \
            -H "Title: ${TITLE}" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -H "Click: ${CLICK_URL}" \
            "${AUTH_ARGS[@]}" \
            -d "$BODY" \
            --max-time 15)

          echo "ntfy HTTP: $HTTP_NTFY"
          cat /tmp/ntfy_resp.txt || true
          if 