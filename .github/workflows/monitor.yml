name: Monitor and Alert

on:
  # A change to this alert workflow validates and exercises only the alert
  # component immediately. Ordinary application commits do not create an
  # extra monitor run.
  push:
    branches: [main]
    paths: [.github/workflows/monitor.yml]
  # The dedicated Cloudflare cron Worker is the sole scheduler. Keeping a
  # GitHub schedule here as well creates overlapping monitor runs at :17.
  workflow_dispatch:
    inputs:
      topic:
        description: Optional focus topic for this monitor run
        required: false
        type: string
      backfill_hours:
        description: Optional catch-up window (1-168 hours); delivered items remain deduplicated
        required: false
        type: string

concurrency:
  group: production-alert-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Refresh direct trusted sources
        continue-on-error: true
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
        run: |
          set -euo pipefail
          APP_URL="${APP_URL%/}"

          # Separate Worker invocations keep each group below the free-plan
          # external-subrequest limit. This path never calls Gemini.
          FAILED=0
          for BATCH in 1 2 3:1 3:2 4:1 4:2; do
            GROUP="${BATCH%%:*}"
            PART=""
            if [[ "$BATCH" == *:* ]]; then PART="${BATCH##*:}"; fi
            BODY="{\"group\":$GROUP}"
            if [ -n "$PART" ]; then BODY="{\"group\":$GROUP,\"groupPart\":$PART}"; fi
            HTTP=$(curl --silent --show-error --location \
              --output "/tmp/direct_group_${BATCH//:/_}.json" \
              --write-out "%{http_code}" \
              --request POST "$APP_URL/api/refresh" \
              --header "Content-Type: application/json" \
              --header "x-cron-secret: $CRON_SECRET" \
              --header "x-vercel-protection-bypass: $VERCEL_BYPASS_TOKEN" \
              --data "$BODY" \
              --max-time 40 || echo "000")
            echo "Direct source batch $BATCH HTTP: $HTTP"
            cat "/tmp/direct_group_${BATCH//:/_}.json" 2>/dev/null || true
            if [ "$HTTP" != "200" ]; then FAILED=$((FAILED + 1)); fi
          done

          # Never suppress alert delivery because publishers are temporarily
          # unavailable. The monitor step below falls back to the last healthy
          # briefing/library already stored in Redis.
          if [ "$FAILED" = "6" ]; then
            echo "All direct source groups failed; continuing with last healthy snapshot"
            exit 1
          fi

      - name: Run monitor
        id: monitor
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
          TOPIC: ${{ inputs.topic }}
          BACKFILL_HOURS: ${{ inputs.backfill_hours }}
        run: |
          set -euo pipefail
          APP_URL="${APP_URL%/}"
          BODY=$(TOPIC="$TOPIC" BACKFILL_HOURS="$BACKFILL_HOURS" python3 -c 'import json, os; body={}; topic=os.environ.get("TOPIC", "").strip(); hours=os.environ.get("BACKFILL_HOURS", "").strip(); body.update({"topic": topic} if topic else {}); body.update({"backfillHours": int(hours)} if hours else {}); print(json.dumps(body))')

          HTTP="000"
          for ATTEMPT in 1 2 3; do
            HTTP=$(curl --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 5 \
              --output /tmp/resp.json \
              --write-out "%{http_code}" \
              --request POST "$APP_URL/api/monitor" \
              --header "Content-Type: application/json" \
              --header "x-cron-secret: $CRON_SECRET" \
              --header "x-vercel-protection-bypass: $VERCEL_BYPASS_TOKEN" \
              --data "$BODY" \
              --max-time 120)
            if [ "$HTTP" = "200" ]; then break; fi
            if [ "$HTTP" != "409" ] && [ "$HTTP" != "500" ] && [ "$HTTP" != "502" ] && [ "$HTTP" != "503" ] && [ "$HTTP" != "504" ]; then break; fi
            echo "Monitor temporarily unavailable (HTTP $HTTP); retrying in 25 seconds ($ATTEMPT/3)"
            sleep 25
          done

          echo "Monitor HTTP: $HTTP"
          cat /tmp/resp.json
          if [ "$HTTP" != "200" ]; then
            exit 1
          fi

          ALERTING=$(python3 -c 'import json; print(json.load(open("/tmp/resp.json")).get("alerting", 0))')
          echo "alerting=$ALERTING" >> "$GITHUB_OUTPUT"

      # Disabled: /api/monitor already sends ntfy with recipient-aware
      # cooldowns. A second workflow sender duplicated messages and exhausted
      # the ntfy daily quota.
      - name: Legacy workflow ntfy sender (disabled)
        if: ${{ false }}
        env:
          ALERTING: ${{ steps.monitor.outputs.alerting }}
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          set -euo pipefail
          APP_URL="${APP_URL%/}"

          python3 <<'PY' > /tmp/ntfy_info.txt
          import json
          import os

          with open("/tmp/resp.json", encoding="utf-8") as response_file:
              data = json.load(response_file)

          app_url = os.environ.get("APP_URL", "").rstrip("/")
          articles = data.get("alertedArticles") or [
              article
              for article in data.get("topScored", [])
              if article.get("shouldAlert")
          ]
          click_url = next(
              (
                  article.get("sourceUrl", "")
                  for article in articles
                  if article.get("sourceUrl") not in (None, "", "#")
              ),
              app_url,
          )

          def format_article(article):
              labels = [
                  str(article.get("section", "")).upper(),
                  str(article.get("category", "")),
                  str(article.get("region", "")),
              ]
              tag = " | ".join(label for label in labels if label)
              score = article.get("score", "?")
              body_items = article.get("body") or [""]
              excerpt = str(body_items[0])[:250]
              if len(str(body_items[0])) > 250:
                  excerpt += "..."
              source_url = article.get("sourceUrl", "")
              if source_url == "#":
                  source_url = ""
              parts = [
                  f"{tag} | Score: {score}/100",
                  str(article.get("headline", "")),
                  excerpt,
                  f"Source: {article.get('source', '')}" if article.get("source") else "",
                  source_url,
              ]
              return "\n".join(part for part in parts if part)

          body = ("\n\n" + "-" * 30 + "\n\n").join(
              format_article(article) for article in articles[:5]
          ) or "See app for details"
          if app_url:
              body += f"\n\n{app_url}"

          print(click_url)
          print(body)
          PY

          CLICK_URL=$(head -n 1 /tmp/ntfy_info.txt)
          tail -n +2 /tmp/ntfy_info.txt > /tmp/ntfy_body.txt
          if [ -z "$CLICK_URL" ]; then
            CLICK_URL="$APP_URL"
          fi

          if [ "$ALERTING" = "1" ]; then
            TITLE="Global Report - 1 alert"
          else
            TITLE="Global Report - $ALERTING alerts"
          fi

          AUTH_ARGS=()
          if [ -n "$NTFY_TOKEN" ]; then
            AUTH_ARGS+=(--header "Authorization: Bearer $NTFY_TOKEN")
          fi

          HTTP_NTFY=$(curl --silent --show-error \
            --output /tmp/ntfy_resp.txt \
            --write-out "%{http_code}" \
            --request POST "https://ntfy.sh/$NTFY_TOPIC" \
            --header "Title: $TITLE" \
            --header "Priority: high" \
            --header "Tags: rotating_light" \
            --header "Click: $CLICK_URL" \
            "${AUTH_ARGS[@]}" \
            --data-binary @/tmp/ntfy_body.txt \
            --max-time 15)

          echo "ntfy HTTP: $HTTP_NTFY"
          cat /tmp/ntfy_resp.txt || true
          if [ "$HTTP_NTFY" != "200" ] && [ "$HTTP_NTFY" != "201" ]; then
            echo "ntfy delivery failed; cooldown was not recorded"
            exit 0
          fi

          python3 <<'PY' > /tmp/alert_keys.json
          import json

          with open("/tmp/resp.json", encoding="utf-8") as response_file:
              data = json.load(response_file)
          # The notification body contains only the first five articles, so
          # record cooldown for exactly those delivered items and no others.
          alert_keys = [
              article["alertKey"]
              for article in data.get("alertedArticles", [])[:5]
              if article.get("alertKey")
          ]
          print(json.dumps({"alertKeys": alert_keys}))
          PY

          HTTP_MARK=$(curl --silent --show-error --location \
            --output /tmp/mark_resp.json \
            --write-out "%{http_code}" \
            --request POST "$APP_URL/api/monitor/delivered" \
            --header "Content-Type: application/json" \
            --header "x-cron-secret: $CRON_SECRET" \
            --data-binary @/tmp/alert_keys.json \
            --max-time 15)

          echo "Cooldown callback HTTP: $HTTP_MARK"
          if [ "$HTTP_MARK" != "200" ]; then
            cat /tmp/mark_resp.json || true
            exit 1
          fi
          echo "ntfy delivered and cooldown recorded"

