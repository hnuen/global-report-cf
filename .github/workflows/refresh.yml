name: Refresh Global Report

on:
  # Timing moved 2026-06-23 to a dedicated Cloudflare Worker (../cron-worker)
  # with its own native Cron Trigger, which calls workflow_dispatch below on
  # the same schedule the old `schedule:` block used. Cloudflare's scheduler
  # runs independent of GitHub Actions' own queue, which was observed
  # silently delaying/dropping `schedule:`-triggered runs by hours under
  # platform load (no SLA on GitHub's side — see cron-worker/wrangler.toml
  # for the current cron slots and rationale). This workflow is now
  # dispatch-only; do not re-add a `schedule:` block here, or both
  # schedulers will fire and double the daily Gemini call count.
  workflow_dispatch:
    inputs:
      job:
        description: 'refresh or monitor'
        required: false
        default: 'refresh'

jobs:
  refresh:
    if: github.event.inputs.job != 'monitor'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Node.js 20 deprecated June 16 2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF parser (for GL expiry extraction)
        # refresh-briefing.mjs reads each GL's own PDF to find expiration
        # dates OFAC states only in the PDF body, never on the program
        # webpage (e.g. Venezuela GL 60 — "authorized through ... October
        # 23, 2026" appears only in the PDF). This job otherwise runs with
        # no `npm ci`/install step at all, so install just this one small
        # package standalone (--no-save: doesn't touch package.json/lock).
        # continue-on-error: a registry hiccup here must not break the rest
        # of the refresh — the script's pdf-parse import is wrapped in a
        # try/catch and degrades to "skip PDF expiry extraction" if missing.
        continue-on-error: true
        run: npm install pdf-parse@1.1.1 --no-save --no-audit --no-fund

      - name: Fetch official sources (fast path — no LLM)
        run: |
          # Fetches official RSS/HTML sources and saves to Redis quickly (~10s).
          # Gemini (LLM) step below replaces this with enriched articles.
          # Strip any trailing slash from APP_URL to avoid a double-slash URL
          # (Cloudflare 308-redirects that, and curl won't follow it without -L).
          APP_URL="${{ secrets.APP_URL }}"
          APP_URL="${APP_URL%/}"

          HTTP=$(curl -s -L -o /tmp/resp.json -w "%{http_code}" \
            -X POST "$APP_URL/api/refresh" \
            -H "Content-Type: application/json" \
            -d "{}" --max-time 30 || echo "000")
          echo "Official sources HTTP: $HTTP"
          cat /tmp/resp.json 2>/dev/null || true

      - name: Call Gemini + save enriched briefing
        # Gemini with Google Search grounding takes 30-90s — too slow for CF's 30s wall-clock limit.
        # We run it here (8-min GitHub Actions timeout) and POST the result to /api/save-briefing.
        # GITHUB_TOKEN commits scraped OFAC data to data/ofac-cache.json so the CF app
        # can read it via raw.githubusercontent.com (ofac.treasury.gov blocks CF IPs).
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          SAVE_BRIEFING_SECRET: ${{ secrets.SAVE_BRIEFING_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/refresh-briefing.mjs

  monitor:
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'monitor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Node.js 20 deprecated June 16 2026
    steps:
      - name: Trigger monitor
        run: |
          # Strip any trailing slash from APP_URL to avoid a double-slash URL
          # (Cloudflare 308-redirects that, and curl won't follow it without -L).
          APP_URL="${{ secrets.APP_URL }}"
          APP_URL="${APP_URL%/}"

          HTTP=$(curl -s -L -o /tmp/resp.json -w "%{http_code}" \
            -X POST "$APP_URL/api/monitor" \
            -H "Content-Type: application/json" \
            -d "{}" --max-time 60 || echo "000")
          echo "Monitor HTTP: $HTTP"
          cat /tmp/resp.json 2>/dev/null || true
