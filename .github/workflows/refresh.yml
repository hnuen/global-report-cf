name: Refresh Global Report

on:
  schedule:
    # Re-registered 2026-06-19 (previously re-registered 2026-06-18) — scheduled
    # trigger keeps silently stopping. GitHub's cron registration can desync after
    # repeated pushes/rebases on main; touching this file forces it to re-parse and
    # re-register the schedule. If runs go missing again, bump this date and re-push.
    # All times EDT (UTC-4). Free tier: 20 RPD — total below = 15 calls/day
    # Minutes offset to :07/:37 (not :00/:30) to dodge GitHub Actions' top-of-hour
    # scheduler congestion, which delays/drops runs queued at :00 and :30.
    # 9:07am, 12:07pm, 1:07pm, 5:07pm, 6:07pm ET — hourly slots outside the 30-min windows
    - cron: '7 13,16,17,21,22 * * *'
    # 8:37am, 9:37am, 5:37pm ET
    - cron: '37 12,13,21 * * *'
    # 10:07am–11:37am ET — every 30 min (10:07, 10:37, 11:07, 11:37)
    - cron: '7,37 14,15 * * *'
    # 2:07pm–4:37pm ET — every 30 min (2:07, 2:37, 3:07, 3:37, 4:07, 4:37)
    - cron: '7,37 18,19,20 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'refresh or monitor'
        required: false
        default: 'refresh'

jobs:
  refresh:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.job != 'monitor'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Node.js 20 deprecated June 16 2026
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch official sources (fast path — no LLM)
        run: |
          # Fetches official RSS/HTML sources and saves to Redis quickly (~10s).
          # Gemini (LLM) step below replaces this with enriched articles.
          # Strip any trailing slash from APP_URL to avoid a double-slash URL
          # (Cloudflare 308-redirects that, and curl won't follow it without -L).
          APP_URL="${{ secrets.APP_URL }}"
          APP_URL="${APP_URL%/}"

          HTTP=$(curl -s -L -o /tmp/resp.json -w "%{http_code}" \
            -X POST "$APP_URL/api/refresh" \
            -H "Content-Type: application/json" \
            -d "{}" --max-time 30 || echo "000")
          echo "Official sources HTTP: $HTTP"
          cat /tmp/resp.json 2>/dev/null || true

      - name: Call Gemini + save enriched briefing
        # Gemini with Google Search grounding takes 30-90s — too slow for CF's 30s wall-clock limit.
        # We run it here (8-min GitHub Actions timeout) and POST the result to /api/save-briefing.
        # GITHUB_TOKEN commits scraped OFAC data to data/ofac-cache.json so the CF app
        # can read it via raw.githubusercontent.com (ofac.treasury.gov blocks CF IPs).
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          SAVE_BRIEFING_SECRET: ${{ secrets.SAVE_BRIEFING_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/refresh-briefing.mjs

  monitor:
    if: |
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'monitor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Node.js 20 deprecated June 16 2026
    steps:
      - name: Trigger monitor
        run: |
          # Strip any trailing slash from APP_URL to avoid a double-slash URL
          # (Cloudflare 308-redirects that, and curl won't follow it without -L).
          APP_URL="${{ secrets.APP_URL }}"
          APP_URL="${APP_URL%/}"

          HTTP=$(curl -s -L -o /tmp/resp.json -w "%{http_code}" \
            -X POST "$APP_URL/api/monitor" \
            -H "Content-Type: application/json" \
            -d "{}" --max-time 60 || echo "000")
          echo "Monitor HTTP: $HTTP"
          cat /tmp/resp.json 2>/dev/null || true
