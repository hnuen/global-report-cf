<svg width="100%" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
<title>App serving and alerting flow</title>
<desc>Upstash Redis feeds both the Next.js app (public pages, API routes, admin panel, serving public readers and the site admin) and the hourly /api/monitor check, which scores articles and hands qualifying ones to the notifier manager for delivery to alert subscribers.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<line x1="340" y1="96" x2="340" y2="116" stroke="#5F5E5A" stroke-width="0.5" fill="none"/>
<path d="M340,116 L300,116 L300,140" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340,116 L636,116 L636,310 L545,310 L545,340" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="150" y1="256" x2="150" y2="340" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M490,256 L490,300 L350,300 L350,340" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="545" y1="396" x2="545" y2="420" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="545" y1="476" x2="545" y2="500" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
  <rect x="140" y="40" width="400" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="58" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Upstash Redis</text>
  <text x="340" y="78" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Briefing, subscribers, cooldowns</text>
</g>

<g>
  <rect x="40" y="140" width="560" height="150" rx="20" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="60" y="164" font-size="14" font-weight="500" fill="#4A1B0C">Next.js app</text>
  <text x="60" y="182" font-size="12" fill="#993C1D">Cloudflare Pages (OpenNext)</text>
</g>
<g>
  <rect x="75" y="200" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="150" y="218" font-size="14" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">Public pages</text>
  <text x="150" y="238" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">3 routes</text>
</g>
<g>
  <rect x="245" y="200" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="320" y="218" font-size="14" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">API routes</text>
  <text x="320" y="238" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">22 routes</text>
</g>
<g>
  <rect x="415" y="200" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="490" y="218" font-size="14" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">Admin panel</text>
  <text x="490" y="238" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">Password-gated</text>
</g>

<g>
  <rect x="60" y="340" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="150" y="358" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Public readers</text>
  <text x="150" y="378" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Web visitors</text>
</g>
<g>
  <rect x="270" y="340" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="350" y="358" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Site admin</text>
  <text x="350" y="378" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Approves &amp; manages</text>
</g>
<g>
  <rect x="470" y="340" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="545" y="358" font-size="14" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">/api/monitor</text>
  <text x="545" y="378" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Hourly check</text>
</g>

<g>
  <rect x="440" y="420" width="210" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="545" y="438" font-size="14" font-weight="500" fill="#4A1B0C" text-anchor="middle" dominant-baseline="central">Notifier manager</text>
  <text x="545" y="458" font-size="12" fill="#993C1D" text-anchor="middle" dominant-baseline="central">Priority + cooldown logic</text>
</g>

<g>
  <rect x="435" y="500" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="545" y="518" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Alert subscribers</text>
  <text x="545" y="538" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Picked by priority order</text>
</g>
</svg>
