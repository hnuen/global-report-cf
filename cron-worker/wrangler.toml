name = "global-report-cron-trigger"
main = "src/index.js"
compatibility_date = "2025-04-01"

# Standalone Cloudflare Worker — separate from the main Pages app (Pages
# projects can't have Cron Triggers; only Workers can). Its only job is to
# fire on schedule and call GitHub's workflow_dispatch API, which is more
# reliable than GitHub Actions' own `schedule:` trigger (best-effort, no SLA,
# known to silently drop/delay runs under platform load — see refresh.yml).
#
# Two workflows are dispatched from here now (see src/index.js's
# CRON_WORKFLOW_MAP, which maps each cron string below to a workflow file):
#   - refresh.yml  : the original 4 slots, business-hours cadence.
#   - monitor.yml  : added 2026-06-27, hourly around the clock — the alert
#     pipeline previously ran on GitHub Actions' native `schedule:`, which hit
#     the same reliability problem refresh.yml already had, causing a
#     multi-day backlog of alerts to burst out at once instead of firing
#     promptly. If you add another workflow here, add its cron string AND a
#     matching entry in CRON_WORKFLOW_MAP — anything not in that map falls
#     back to dispatching refresh.yml.
[triggers]
crons = [
  "7 13,15,17,19,21,22 * * *", # six refreshes during U.S. business hours
  "17 * * * *",               # every hour on the :17 — monitor.yml
]
