name = "global-report-cf"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".open-next"

[vars]
# The checked-in lockfile was stale and blocked Cloudflare before the build
# command ran. Install the pinned top-level toolchain inside build:pages.
SKIP_DEPENDENCY_INSTALL = "1"

[limits]
# Default CF Workers limit is 50 subrequests/invocation. The refresh route
# fetches 60+ RSS feeds + Redis ops in a single invocation, which exceeds
# the default. Requires Workers Paid plan; ignored on free plan.
#
# cpu_ms is the max CPU time per request. It was previously 50 (ms), which
# capped every request at 50ms of compute — the heavy refresh groups and
# /api/save-briefing (parsing 60+ feeds, serialising 150+ articles) exceeded
# that and Cloudflare killed them with HTTP 503 "error 1102: Worker exceeded
# resource limits". Raised to 30000ms (30s) so those requests can complete.
cpu_ms = 30000
subrequests = 500
